description: "SpikeInterface is a Python framework designed to make the analysis of
  extracellular electrophysiology data more accessible and standardized. The SpikeInterface
  documentation can be found at https://spikeinterface.readthedocs.io/en/latest/.\n
  \nThis dataset contains all recordings analysed in the paper: \"SpikeInterface,
  a unified framework for spike sorting.\" Alessio P. Buccino, Cole L. Hurwitz, Samuel
  Garcia, Jeremy Magland, Joshua H. Siegle, Roger Hurwitz, Matthias H. Hennig, eLife
  - doi: https://doi.org/10.7554/eLife.61834; "
